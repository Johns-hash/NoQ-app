<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoQ – scan, join, skip the line</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="qrcode.js"></script>
<style>
:root{--bg:#090909;--card:#171717;--ink:#f5f5f1;--mute:#aaa;--line:#303030;--hero:#181818;--hero-ink:#fff;--go:#e50914;--blue:#e50914;--warn:#ff5361;--chip:#292929;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#f5f5f5;--card:#fff;--ink:#161616;--mute:#666;--line:#ddd;--hero:#181818;--hero-ink:#fff;--chip:#e7e7e7}
:root[data-theme="dark"]{--bg:#090909;--card:#171717;--ink:#f5f5f1;--mute:#aaa;--line:#303030;--hero:#181818;--chip:#292929}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#351013 0,transparent 44%),var(--bg);color:var(--ink);font:500 15px/1.45 "DM Sans",system-ui,sans-serif}
#shell{max-width:460px;margin:0 auto;min-height:100vh;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.9px;margin:10px 0 16px;text-wrap:balance}
h2{font-size:19px;font-weight:800;margin:22px 0 10px;letter-spacing:-.3px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:25px;letter-spacing:-1.3px;display:flex;align-items:center;gap:7px}.logo i{font-style:normal;background:#e50914;color:#fff;border-radius:3px;padding:1px 7px;margin-right:0;font-size:22px;box-shadow:0 4px 18px #e5091430}.logo:after{content:'YOUR NEXT TURN';font-size:8px;letter-spacing:1.5px;color:#aaa;font-weight:800;margin-left:3px;align-self:flex-end;padding-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0 8px;scrollbar-width:none}
.chip{border:1px solid #383838;background:#202020;color:var(--ink);font:700 13px "DM Sans";padding:9px 14px;border-radius:5px;white-space:nowrap;cursor:pointer}.chip.on{background:#e50914;border-color:#e50914;color:#fff}
.card{background:linear-gradient(145deg,#1b1b1b,#121212);border:1px solid #2a2a2a;border-radius:9px;padding:14px;margin-bottom:12px;box-shadow:0 7px 24px #0003}
.v{display:flex;gap:12px;align-items:center}
.tile{width:54px;height:54px;border-radius:7px;background:linear-gradient(145deg,#333,#1d1d1d);border:1px solid #3a3a3a;display:grid;place-items:center;font-size:27px;flex:none;box-shadow:inset 0 0 18px #ffffff06}
.v .nm{font-weight:800;font-size:16px;letter-spacing:-.2px}.v .sub{color:var(--mute);font-size:12px}
.pill{margin-left:auto;background:#303030;border-radius:4px;padding:5px 9px;font-weight:800;font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.35px}
.pill.g{background:#e5091424;color:#ff6068}.pill.r{background:#ff536126;color:#ff7a83}
.row2{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:5px;background:#e50914;color:#fff;font:800 13px "DM Sans";padding:12px 16px;cursor:pointer;box-shadow:0 4px 12px #e5091420;transition:transform .15s,filter .15s}.btn:active{transform:scale(.97)}.btn.g{background:#e50914;color:#fff}.btn.s{background:#303030;color:#fff;box-shadow:none}.btn.d{background:#3a1719;color:#ff6972;box-shadow:none}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.w{width:100%}
.banner{background:linear-gradient(110deg,#b20710,#e50914 55%,#72070c);color:#fff;border-radius:8px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;cursor:pointer;box-shadow:0 8px 24px #e5091425;position:relative;overflow:hidden}.banner:after{content:'次';position:absolute;right:45px;top:-21px;font-size:100px;font-weight:800;color:#ffffff0b;pointer-events:none}.banner b{font-size:20px;letter-spacing:-.4px}
.hero{background:linear-gradient(125deg,#25090b 0%,#151515 58%,#282020 100%);color:var(--hero-ink);border:1px solid #452023;border-radius:10px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:'QUEUE ARC  •  EP.01';position:absolute;right:13px;top:13px;font-size:8px;letter-spacing:1.6px;color:#ff777c;font-weight:800;opacity:.8}.hero .k{opacity:.78;font-size:12px}.hero .big{font-size:45px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:10px 0 14px}.bar{height:5px;border-radius:9px;background:#ffffff24;overflow:hidden}.bar i{display:block;height:100%;background:#e50914;border-radius:9px;transition:width .6s;box-shadow:0 0 12px #e5091480}
.tok{font-size:62px;font-weight:800;letter-spacing:-2px;line-height:1;color:#f5f5f1}.ppl{display:flex;margin-top:10px;align-items:center}.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;border:3px solid var(--card);margin-left:-8px;background:#7c151a}.av:first-child{margin-left:0}
.steps{display:flex;margin:4px 0 2px}.st{flex:1;text-align:center;font-size:11px;color:var(--mute);font-weight:700}.st b{display:block;width:22px;height:22px;border-radius:50%;background:#303030;margin:0 auto 4px;line-height:22px;font-size:11px}.st.on{color:var(--ink)}.st.on b{background:#e50914;color:#fff}
.ctr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ctr:first-child{border-top:0}.ctr .n{font-weight:800;font-size:21px;min-width:52px;letter-spacing:-.5px;color:#ff555d}.ctr small{color:var(--mute);display:block;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:linear-gradient(145deg,#1c1c1c,#111);border:1px solid #292929;border-radius:8px;padding:12px;text-align:center}.stats b{font-size:27px;letter-spacing:-1px;display:block;line-height:1.1}.stats span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}.empty .e{font-size:48px;filter:grayscale(.15)}
nav{position:fixed;left:0;right:0;bottom:0;background:#101010f5;backdrop-filter:blur(18px);border-top:1px solid #303030;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav div{max-width:460px;margin:0 auto;display:flex}nav button{flex:1;border:0;background:none;color:#888;font:700 10px "DM Sans";padding:9px 0 8px;cursor:pointer}nav button span{display:block;font-size:21px;line-height:1.2;margin-bottom:2px}nav button.on{color:#fff}nav button.on span{filter:drop-shadow(0 0 7px #e5091480)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(4px);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}.sheet>div{background:#171717;border:1px solid #333;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .25s}@keyframes up{from{transform:translateY(40px);opacity:0}}.scan i{animation:sw 2s ease-in-out infinite alternate}@keyframes sw{to{top:92%}}.card{transition:border-color .2s,transform .2s}.card:active{transform:scale(.995);border-color:#5a272a}}
input{width:100%;font:500 16px "DM Sans";padding:14px;border-radius:6px;border:1px solid #383838;background:#242424;color:var(--ink);margin:8px 0 12px}input:focus{outline:0;border-color:#e50914;box-shadow:0 0 0 2px #e5091425}button:focus-visible{outline:3px solid #ff7b80;outline-offset:2px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:436px;margin:0 auto;background:#f5f5f1;color:#111;border-left:4px solid #e50914;border-radius:5px;padding:14px 16px;font-weight:700;z-index:20;transform:translateY(-140%);transition:transform .3s}#toast.show{transform:none}
.lg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px;gap:10px}.lg:first-child{border-top:0}
.scan{position:relative;width:100%;aspect-ratio:1;max-width:300px;margin:18px auto;border-radius:12px;background:linear-gradient(135deg,#25090b,#101010);border:1px solid #4a2023;overflow:hidden}.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scan i{position:absolute;left:10%;right:10%;top:8%;height:3px;background:#e50914;box-shadow:0 0 14px #e50914;border-radius:3px}.scan b{position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:5px}.scan .a{left:14px;top:14px;border-right:0;border-bottom:0}.scan .b{right:14px;top:14px;border-left:0;border-bottom:0}.scan .c{left:14px;bottom:14px;border-right:0;border-top:0}.scan .d{right:14px;bottom:14px;border-left:0;border-top:0}.qr{background:#fff;border-radius:8px;padding:14px;width:210px;margin:10px auto 6px}.qr svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div id="shell"><div id="app"></div></div>
<nav><div id="nav"></div></nav>
<div class="sheet" id="sheet" hidden><div id="sheetIn"></div></div>

<script>
var ORG={name:"City General Hospital",where:"Main entrance",tok:"cgh",url:"https://claude.ai/artifact/Eh5GwQpcpyCZkN8Y3Tf2cs"};
var DEP=[
{id:"gm",l:"G",name:"General Medicine",e:"🩺",avg:9,c:3},
{id:"pd",l:"P",name:"Pediatrics",e:"🧸",avg:12,c:2},
{id:"or",l:"O",name:"Orthopedics",e:"🦴",avg:14,c:2},
{id:"lb",l:"L",name:"Lab & Diagnostics",e:"🧪",avg:5,c:3},
{id:"ph",l:"H",name:"Pharmacy",e:"💊",avg:3,c:2},
{id:"bl",l:"B",name:"Billing & Insurance",e:"🧾",avg:6,c:2}];
var NAMES=["Aarav","Meera","Kabir","Sana","Ishan","Diya","Rohan","Nila","Zoya","Arjun","Tara","Vik","Leela","Dev"];
var COL=["#276ef1","#e11900","#06c167","#7356bf","#ff6937","#0e8a7d","#b3269a"];
var KEY="noq-dept-v3",view="home",selV=DEP[0].id,S=null,scanning=false,stream=null;
function fresh(){var s={t:[],seq:{},name:"",demo:true,mine:null,in:false};DEP.forEach(function(v){s.seq[v.id]=20+Math.floor(Math.random()*30);});S=s;
 DEP.forEach(function(v){var n=2+Math.floor(Math.random()*5);for(var i=0;i<n;i++)add(v.id,rn());for(var c=1;c<=v.c-1;c++){var w=wait(v.id)[0];if(w)call(w,c);}});}
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);}catch(e){}
if(!S||!S.t)fresh();
if(location.hash==="#"+ORG.tok)S.in=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ven(id){return DEP.filter(function(v){return v.id===id})[0];}
function rn(){return NAMES[Math.floor(Math.random()*NAMES.length)];}
function code(t){return ven(t.v).l+"-"+String(t.n).padStart(3,"0");}
function wait(v){return S.t.filter(function(t){return t.v===v&&t.st==="waiting"});}
function srv(v){return S.t.filter(function(t){return t.v===v&&t.st==="serving"});}
function mine(){return S.t.filter(function(t){return t.id===S.mine})[0];}
function active(){var t=mine();return t&&(t.st==="waiting"||t.st==="serving")?t:null;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function add(v,name,me){S.seq[v]++;var V=ven(v),t={id:"t"+Date.now()+Math.floor(Math.random()*1e5),v:v,n:S.seq[v],name:name,st:"waiting",at:Date.now(),dur:Math.round(V.avg*1000*(0.6+Math.random()*0.8)),y:0,start:wait(v).length,me:!!me};S.t.push(t);return t;}
function call(t,c){t.st="serving";t.c=c;t.ct=Date.now();}
function eta(t){if(t.st==="serving")return 0;var V=ven(t.v),i=wait(t.v).indexOf(t);return Math.max(1,Math.round((i+0.5+srv(t.v).length*0.5)*V.avg/V.c));}
function waitMin(v){var V=ven(v);return Math.max(0,Math.round((wait(v).length+srv(v).length*0.5)*V.avg/V.c));}
function toast(m){var el=document.getElementById("toast");el.textContent=m;el.className="show";try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}clearTimeout(toast.h);toast.h=setTimeout(function(){el.className="";},3800);}

function tick(){
 if(S.demo){var now=Date.now();DEP.forEach(function(V){
  srv(V.id).forEach(function(t){if(now-t.ct>t.dur){t.st="done";t.dt=now;}});
  for(var c=1;c<=V.c;c++){if(!srv(V.id).some(function(x){return x.c===c})){var nx=wait(V.id)[0];if(nx)call(nx,c);}}
  if(wait(V.id).length<9&&Math.random()<0.14*6/V.avg+0.03)add(V.id,rn());});}
 var m=active();if(m){var i=wait(m.v).indexOf(m);
  if(m.st==="waiting"&&i<=1&&!m.n1){m.n1=1;toast("You’re almost up at "+ven(m.v).name+". Head over now.");}
  if(m.st==="serving"&&!m.n2){m.n2=1;toast("Your turn! Go to counter "+m.c+".");}}
 save();if(document.getElementById("sheet").hidden&&!scanning)R();
}

function enter(){stopCam();S.in=true;save();view="home";R();toast("Connected to "+ORG.name);}
function stopCam(){scanning=false;if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}}
function startCam(){
 if(!navigator.mediaDevices||!window.BarcodeDetector){toast("Camera scanning isn’t available here. Use your phone’s camera app or the demo scan.");return;}
 scanning=true;R();
 navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
  stream=s;var v=document.getElementById("cam");if(!v){stopCam();return;}v.srcObject=s;v.play();
  var d=new BarcodeDetector({formats:["qr_code"]});
  (function loop(){if(!scanning)return;d.detect(v).then(function(r){if(r.length&&r[0].rawValue.indexOf(ORG.tok)>-1){enter();}else setTimeout(loop,350);}).catch(function(){setTimeout(loop,500);});})();
 }).catch(function(){scanning=false;R();toast("Camera blocked. Use the demo scan instead.");});
}
function demoScan(){scanning=true;R();setTimeout(enter,1400);}

function scanScreen(){
 return '<div class="top"><div class="logo"><i>N</i>NoQ</div></div><h1>Scan the QR at the entrance</h1>'+
 '<div class="scan">'+(stream||scanning&&navigator.mediaDevices?'<video id="cam" playsinline muted></video>':'')+'<b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b><i></i></div>'+
 '<p style="color:var(--mute);text-align:center;margin:0 0 16px">Scanning shows the departments here, so you can take a token without standing in a line.</p>'+
 (scanning?'<button class="btn s w" onclick="stopCam();R()">Cancel</button>':'<button class="btn w" onclick="startCam()">Scan QR code</button><button class="btn s w" style="margin-top:8px" onclick="demoScan()">Try demo scan</button>');}

function home(){
 if(!S.in)return scanScreen();
 var a=active(),h='<div class="top"><div class="logo"><i>N</i>NoQ</div><span class="pill g">● Connected</span></div>'+
 '<div class="card" style="margin-top:14px"><div class="v"><div class="tile">🏥</div><div><div class="nm">'+esc(ORG.name)+'</div><div class="sub">Scanned at '+esc(ORG.where)+'</div></div></div></div><h1 style="font-size:26px;margin-top:18px">Choose a department</h1>';
 if(a)h+='<div class="banner" onclick="go(\'queue\')"><div><div style="opacity:.85;font-size:13px">Your token · '+esc(ven(a.v).name)+'</div><b>'+code(a)+' · '+(a.st==="serving"?"Your turn":"~"+eta(a)+" min")+'</b></div><b>›</b></div>';
 DEP.forEach(function(v){var w=wait(v.id).length,mn=waitMin(v.id),s=srv(v.id).map(code).join(", ")||"–";
  h+='<div class="card"><div class="v"><div class="tile">'+v.e+'</div><div><div class="nm">'+esc(v.name)+'</div><div class="sub">'+v.c+' counters · '+w+' waiting</div></div><span class="pill '+(mn<8?'g':mn>25?'r':'')+'">~'+mn+' min</span></div>'+
  '<div class="row2"><span>Now serving '+s+'</span><button class="btn" '+(a?'disabled':'')+' onclick="openJoin(\''+v.id+'\')">Get token</button></div></div>';});
 if(a)h+='<p style="color:var(--mute);text-align:center">You already hold a token. Leave it to join another department.</p>';
 return h;}

function queue(){
 var t=active();
 if(!t)return '<h1>My queue</h1><div class="empty"><div class="e">🎟️</div><p>No active token.<br>'+(S.in?'Pick a department to get one.':'Scan the QR at the entrance first.')+'</p><button class="btn" onclick="go(\'home\')">'+(S.in?'Choose department':'Scan QR')+'</button></div>';
 var V=ven(t.v),W=wait(t.v),i=W.indexOf(t),now=t.st==="serving",e=eta(t),pr=now?100:Math.round((1-i/Math.max(1,t.start||1))*90+5),ahead=W.slice(0,i);
 var h='<h1>Live tracking</h1><div class="hero"><div class="k">'+esc(ORG.name)+' · '+esc(V.name)+'</div><div class="big">'+(now?'Your turn':'~'+e+' min')+'</div><div class="bar"><i style="width:'+pr+'%"></i></div>'+
 '<div class="k" style="margin-top:10px">'+(now?'Go to counter '+t.c+' now':(i===0?'You’re next in line':ahead.length+' '+(ahead.length===1?'person':'people')+' ahead of you'))+'</div></div>';
 h+='<div class="card"><div style="color:var(--mute);font-size:13px">Your token</div><div class="tok">'+code(t)+'</div><div class="ppl">'+
 ahead.slice(-5).map(function(p,k){return '<div class="av" style="background:'+COL[(p.n+k)%COL.length]+'">'+esc(p.name[0])+'</div>'}).join("")+(ahead.length>5?'<span style="margin-left:8px;color:var(--mute);font-weight:700">+'+(ahead.length-5)+'</span>':'')+
 (ahead.length?'':'<span style="color:var(--mute)">'+(now?'Counter '+t.c+' is ready':'Nobody ahead of you')+'</span>')+'</div>'+
 '<div class="steps" style="margin-top:16px"><div class="st on"><b>✓</b>Joined</div><div class="st '+(i<=1||now?'on':'')+'"><b>'+(i<=1||now?'✓':'2')+'</b>Almost up</div><div class="st '+(now?'on':'')+'"><b>'+(now?'✓':'3')+'</b>Your turn</div></div></div>';
 h+='<div class="card"><div style="font-weight:800;margin-bottom:6px">Counters</div>';
 for(var c=1;c<=V.c;c++){var s=srv(t.v).filter(function(x){return x.c===c})[0];h+='<div class="ctr"><div class="n">C'+c+'</div><div>'+(s?'<b>'+code(s)+'</b><small>Now serving</small>':'<b>Free</b><small>Waiting for next token</small>')+'</div></div>';}
 h+='</div><div style="display:flex;gap:8px"><button class="btn s w" '+((now||t.y>=1||i>=W.length-1)?'disabled':'')+' onclick="yieldSpot()">Let 1 go ahead</button><button class="btn d w" onclick="leave()">'+(now?'I’m done':'Leave queue')+'</button></div>';
 return h;}

function activity(){
 var L=S.t.filter(function(t){return t.me&&(t.st==="done"||t.st==="left"||t.st==="skipped")}).reverse(),h='<h1>Activity</h1>';
 if(!L.length)return h+'<div class="empty"><div class="e">🕘</div><p>Your finished visits will show up here.</p></div>';
 return h+'<div class="card">'+L.map(function(t){var lab=t.st==="done"?"Served":t.st==="left"?"Left queue":"Missed";
  return '<div class="lg"><div><b>'+esc(ven(t.v).name)+'</b><div style="color:var(--mute);font-size:13px">'+code(t)+' · '+new Date(t.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</div></div><span class="pill '+(t.st==="done"?'g':'')+'">'+lab+'</span></div>'}).join("")+'</div>';}

function qrSvg(){try{var q=qrcode(0,"M");q.addData(ORG.url+"#"+ORG.tok);q.make();return q.createSvgTag(6,0);}catch(e){return '<p style="color:#111;text-align:center">QR unavailable</p>';}}
function staff(){
 var V=ven(selV),W=wait(selV),done=S.t.filter(function(t){return t.v===selV&&t.st==="done"}).length;
 var h='<h1>Staff console</h1><div class="card" style="text-align:center"><div style="font-weight:800">Entrance QR for '+esc(ORG.name)+'</div><div class="qr">'+qrSvg()+'</div><div style="color:var(--mute);font-size:13px">Print this and place it at the entrance. Scanning opens the department list.</div></div>'+
 '<div class="chips">'+DEP.map(function(v){return '<button class="chip'+(v.id===selV?' on':'')+'" onclick="selV=\''+v.id+'\';R()">'+v.e+' '+esc(v.name)+'</button>'}).join("")+'</div>'+
 '<div class="stats" style="margin-top:10px"><div><b>'+W.length+'</b><span>waiting</span></div><div><b>'+done+'</b><span>served</span></div><div><b>~'+waitMin(selV)+'</b><span>min wait</span></div></div><div class="card">';
 for(var c=1;c<=V.c;c++){var s=srv(selV).filter(function(x){return x.c===c})[0];
  h+='<div class="ctr"><div class="n">C'+c+'</div><div style="flex:1;min-width:0">'+(s?'<b>'+code(s)+'</b> '+esc(s.name)+'<small>In service</small>':'<b>Idle</b><small>Ready</small>')+'</div><button class="btn g" '+((s||W.length)?'':'disabled')+' onclick="nextAt(\''+selV+'\','+c+')">'+(W.length?'Next':'Free')+'</button></div>';}
 h+='</div><h2>Waiting</h2><div class="card">'+(W.length?W.slice(0,8).map(function(t){return '<div class="lg"><div><b>'+code(t)+'</b> '+esc(t.name)+(t.me?' (you)':'')+'<div style="color:var(--mute);font-size:13px">~'+eta(t)+' min</div></div><button class="btn s" onclick="skip(\''+t.id+'\')">Skip</button></div>'}).join("")+(W.length>8?'<div class="lg" style="color:var(--mute)">+'+(W.length-8)+' more</div>':''):'<div class="empty" style="padding:14px">Line is clear.</div>')+'</div>'+
 '<div class="card"><div class="lg"><div><b>Live demo</b><div style="color:var(--mute);font-size:13px">Auto-serves and adds people</div></div><button class="btn '+(S.demo?'g':'s')+'" onclick="S.demo=!S.demo;save();R()">'+(S.demo?'On':'Off')+'</button></div>'+
 '<div class="lg"><button class="btn s" onclick="add(selV,rn());save();R()">+ Walk-in</button><button class="btn d" onclick="resetAll()">Reset</button></div></div>';
 return h;}

function R(){var h=view==="home"?home():view==="queue"?queue():view==="activity"?activity():staff();
 document.getElementById("app").innerHTML=h;
 if(scanning&&stream){var v=document.getElementById("cam");if(v){v.srcObject=stream;v.play();}}
 var N=[["home","🏠","Home"],["queue","🎟️","My queue"],["activity","🕘","Activity"],["staff","🛠️","Staff"]];
 document.getElementById("nav").innerHTML=N.map(function(n){return '<button class="'+(view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join("");}
function go(v){if(scanning&&v!=="home"){stopCam();}view=v;R();window.scrollTo(0,0);}
function openJoin(id){var V=ven(id);document.getElementById("sheetIn").innerHTML='<div class="tile" style="margin-bottom:8px">'+V.e+'</div><div style="font-size:22px;font-weight:800">'+esc(V.name)+'</div>'+
 '<div style="color:var(--mute)">'+esc(ORG.name)+' · '+wait(id).length+' waiting · about '+waitMin(id)+' min</div><label for="nm" style="font-weight:700;display:block;margin-top:14px">Your name</label>'+
 '<input id="nm" value="'+esc(S.name)+'" placeholder="e.g. Priya" autocomplete="given-name"><button class="btn g w" onclick="doJoin(\''+id+'\')">Get my token</button><button class="btn s w" style="margin-top:8px" onclick="closeSheet()">Cancel</button>';
 document.getElementById("sheet").hidden=false;setTimeout(function(){document.getElementById("nm").focus();},50);}
function closeSheet(){document.getElementById("sheet").hidden=true;R();}
function doJoin(id){var nm=document.getElementById("nm").value.trim();if(!nm){document.getElementById("nm").focus();return;}
 S.name=nm;var t=add(id,nm,true);S.mine=t.id;save();document.getElementById("sheet").hidden=true;view="queue";R();toast("You’re in. Token "+code(t)+".");}
function leave(){var t=active();if(t){t.st=t.st==="serving"?"done":"left";t.dt=Date.now();}S.mine=null;save();view="home";R();}
function yieldSpot(){var t=active(),W=wait(t.v),i=W.indexOf(t);if(i<0||i>=W.length-1)return;var o=W[i+1],a=t.n,at=t.at;t.n=o.n;t.at=o.at;o.n=a;o.at=at;t.y=1;
 var p=S.t.indexOf(t),q=S.t.indexOf(o);S.t[p]=o;S.t[q]=t;save();R();toast("Moved back one place. No penalty.");}
function nextAt(v,c){srv(v).filter(function(x){return x.c===c}).forEach(function(x){x.st="done";x.dt=Date.now();});var n=wait(v)[0];if(n)call(n,c);save();R();}
function skip(id){S.t.forEach(function(t){if(t.id===id)t.st="skipped";});save();R();}
function resetAll(){if(confirm("Reset all queues?")){fresh();save();view="home";R();}}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
window.addEventListener("hashchange",function(){if(location.hash==="#"+ORG.tok){S.in=true;save();R();}});
R();setInterval(tick,1000);
</script>
